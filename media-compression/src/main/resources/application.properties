# Server Configuration
server.port=8080
server.address=localhost

# Application Name
spring.application.name=Media Compression Service

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
spring.servlet.multipart.file-size-threshold=10MB

# H2 Database Configuration (Embedded)
spring.datasource.url=jdbc:h2:file:./data/compression_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging Configuration
logging.level.root=INFO
logging.level.com.media.compression=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Storage Configuration
app.storage.input-dir=uploads/input
app.storage.output-dir=uploads/output
app.storage.temp-dir=uploads/temp

# Server URL (for file access)
app.server.base-url=http://localhost:8080

# FFmpeg Configuration
app.ffmpeg.path=ffmpeg
app.ffprobe.path=ffprobe

# TCP Server Configuration
app.tcp.port=9090
app.tcp.enabled=true
